<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e12" />
      <stop offset="50%" stop-color="#08090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14161b" />
      <stop offset="100%" stop-color="#0f1014" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle ambient grid/glow -->
  <circle cx="200" cy="150" r="220" fill="#c084fc" opacity="0.04" filter="url(#glow)" />
  <circle cx="1000" cy="400" r="260" fill="#e879f9" opacity="0.03" filter="url(#glow)" />

  <!-- Top Navigation Bar -->
  <g transform="translate(0, 0)">
    <rect width="1200" height="70" fill="#090a0d" stroke="#1c1f26" stroke-width="1" />
    
    <!-- Brand Logo -->
    <text x="40" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="800" fill="url(#brandGrad)" letter-spacing="-0.5">Obsidian Architect</text>
    
    <!-- Nav Links -->
    <g transform="translate(420, 43)" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500">
      <text x="0" y="0" fill="#ffffff" font-weight="700">Home</text>
      <!-- Active underline -->
      <line x1="-2" y1="8" x2="42" y2="8" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
      
      <text x="80" y="0" fill="#9ca3af">Add Class</text>
      <text x="180" y="0" fill="#9ca3af">My Classes</text>
      <text x="290" y="0" fill="#9ca3af">Contact us</text>
    </g>

    <!-- Top Right Controls -->
    <g transform="translate(1020, 24)">
      <!-- AR Pill -->
      <rect x="0" y="0" width="34" height="24" rx="12" fill="#181a20" stroke="#282c37" stroke-width="1" />
      <text x="9" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#e5e7eb">AR</text>

      <!-- Theme Icon -->
      <circle cx="56" cy="12" r="12" fill="#181a20" stroke="#282c37" stroke-width="1" />
      <circle cx="56" cy="12" r="4" fill="#fbbf24" />

      <!-- Notification Bell -->
      <circle cx="90" cy="12" r="12" fill="#181a20" stroke="#282c37" stroke-width="1" />
      <path d="M87 13 C87 10 93 10 93 13 L94 15 L86 15 Z" fill="#fbbf24" />

      <!-- User Avatar -->
      <circle cx="126" cy="12" r="14" fill="#2d1b4e" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="126" cy="10" r="5" fill="#c084fc" />
      <path d="M117 23 C117 18 135 18 135 23" fill="#c084fc" />
    </g>
  </g>

  <!-- Hero Welcome Row -->
  <g transform="translate(40, 140)">
    <text x="0" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Welcome back Mohamed.</text>
    <!-- Glowing Cursor/Divider -->
    <rect x="585" y="0" width="3.5" height="52" fill="#c084fc" opacity="0.9" rx="1.5" />
  </g>

  <!-- 3 Quick Metrics Cards -->
  <g transform="translate(40, 230)">
    <!-- Card 1: Classes Today -->
    <g transform="translate(0, 0)">
      <rect width="360" height="150" rx="12" fill="url(#cardGrad)" stroke="#1f232d" stroke-width="1.2" />
      <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="1.2">CLASSES TODAY</text>
      <text x="24" y="112" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="800" fill="#c084fc">0</text>
    </g>

    <!-- Card 2: Tasks Today -->
    <g transform="translate(380, 0)">
      <rect width="360" height="150" rx="12" fill="url(#cardGrad)" stroke="#1f232d" stroke-width="1.2" />
      <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="1.2">TASKS TODAY</text>
      <text x="24" y="112" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="800" fill="#38bdf8">0</text>
    </g>

    <!-- Card 3: Tasks Due This Week -->
    <g transform="translate(760, 0)">
      <rect width="360" height="150" rx="12" fill="url(#cardGrad)" stroke="#1f232d" stroke-width="1.2" />
      <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="1.2">TASKS DUE THIS WEEK</text>
      <text x="24" y="112" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="800" fill="#eab308">0</text>
    </g>
  </g>

  <!-- Lower Section: Today's Schedule & Priority Tasks -->
  <g transform="translate(40, 420)">
    
    <!-- Left Column: Today's Schedule -->
    <g transform="translate(0, 0)">
      <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Today's Schedule</text>
      <text x="440" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6b7280">Monday, Aug 31, 2026</text>

      <!-- Schedule Banner -->
      <g transform="translate(0, 45)">
        <rect width="550" height="42" rx="8" fill="#14161b" stroke="#1f232d" stroke-width="1" />
        <circle cx="20" cy="21" r="4" fill="#a855f7" />
        <text x="34" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#d1d5db" letter-spacing="0.5">0 NO LECTURES SCHEDULED TODAY</text>
        <rect x="475" y="10" width="55" height="22" rx="4" fill="#0f1014" />
        <text x="490" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4b5563">--:--</text>
      </g>

      <!-- Empty Schedule Card -->
      <g transform="translate(30, 105)">
        <!-- Timeline vertical connector -->
        <line x1="-15" y1="-10" x2="-15" y2="65" stroke="#282c37" stroke-width="2" />
        <circle cx="-15" cy="20" r="4" fill="#4b5563" />

        <rect width="520" height="75" rx="8" fill="#111317" stroke="#1c1f26" stroke-width="1" />
        <text x="20" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#ffffff">No Classes Indexed</text>
        <text x="20" y="54" font-family="'Inter', sans-serif" font-size="12" fill="#6b7280">Click 'Add Class' to define nodes.</text>
      </g>
    </g>

    <!-- Right Column: Priority Tasks -->
    <g transform="translate(600, 0)">
      <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Priority Tasks</text>
      <text x="460" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="0.5">VIEW ALL</text>

      <!-- Empty Tasks Card -->
      <g transform="translate(0, 45)">
        <rect width="520" height="85" rx="8" fill="#121418" stroke="#1f232d" stroke-width="1" />
        <text x="24" y="44" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#ffffff">No Priority Tasks</text>
        <text x="24" y="66" font-family="'Inter', sans-serif" font-size="12" fill="#6b7280">All task queues cleared.</text>
      </g>
    </g>

  </g>
</svg>

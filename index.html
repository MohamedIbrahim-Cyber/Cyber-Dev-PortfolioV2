<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberDev Portfolio</title>
    <meta name="description" content="Developer portfolio and engineering showcase with responsive bento grids, interactive terminal, and accessible design system." />
    <meta property="og:title" content="CyberDev Portfolio" />
    <meta property="og:description" content="Developer portfolio and engineering showcase with responsive bento grids, interactive terminal, and accessible design system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Instant Inline Theme & Lang Hydration Script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', savedTheme);
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var savedLang = localStorage.getItem('lang') || 'en';
          document.documentElement.setAttribute('lang', savedLang);
          document.documentElement.setAttribute('dir', savedLang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text-primary)] antialiased selection:bg-[var(--accent)] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
